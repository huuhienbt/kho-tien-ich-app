<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Drive - Tiện Ích Nguyễn Hiển</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .file-list-container { max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin-top: 15px; text-align: left; background: #f8fafc; }
        .file-item { padding: 8px 12px; border-bottom: 1px dashed var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; transition: background 0.2s;}
        .file-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; color: var(--text); font-weight: 500; }
        .file-status { font-weight: bold; font-size: 0.95em; white-space: nowrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="main-nav">
        <div class="nav-tabs">
            <a href="index.html" class="nav-btn">📚 Kho Prompt</a>
            <a href="repairs.html" class="nav-btn">🛠 Sổ Repairs</a>
            <a href="upload.html" class="nav-btn active-upload">📁 Upload Drive</a>
            <a href="ai.html" class="nav-btn">🤖 Trợ Giảng AI</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-primary btn-login" onclick="openModal('loginModal')">🔒 Đăng nhập</button>
            <button class="btn btn-danger admin-only btn-inline" onclick="logout()">Thoát quản trị</button>
        </div>
    </div>

    <div class="header" style="margin-bottom: 20px;">
        <h3>Trung tâm Upload Dữ Liệu</h3>
        <a href="https://drive.google.com/drive/u/0/folders/1r5BGSJW3_gf2JxS7aX5vSky8Jz-ebJgV" target="_blank" class="btn btn-primary admin-only btn-inline" style="background: #be185d; text-decoration: none;">📂 Mở thư mục</a>
    </div>
    <div class="grid" style="gap: 20px;">
        <div class="card" style="max-width: 500px; margin: 0 auto; width: 100%; border-top: 4px solid #10b981;">
            <div class="card-header"><h3 class="card-title">⚡ Tải File Nhỏ (<15MB)</h3></div>
            <div style="font-size: 0.85em; color: var(--text-light); margin-bottom: 12px; font-style: italic;">Hỗ trợ chọn nhiều file.</div>
            <input type="file" id="fileInputLight" multiple style="margin-bottom:12px; width: 100%; border: 1px dashed var(--border); padding: 15px; border-radius: 6px; box-sizing: border-box;">
            <button class="btn btn-primary" onclick="uploadLightFile()" id="btnUploadLight" style="width: 100%; padding: 10px; background:#10b981;">🚀 Tải lên</button>
            <div id="progressContainerLight" style="display:none; margin-top:15px;"><div style="display:flex; justify-content:space-between; font-size:0.85em; margin-bottom:5px; color:var(--text-light); font-weight:bold;"><span id="progressStatusLight">Đang xử lý...</span> <span id="progressTextLight">0%</span></div><div style="width:100%; background:#e2e8f0; border-radius:8px; height:8px;"><div id="progressBarLight" style="width:0%; height:100%; background:#10b981; transition:width 0.3s;"></div></div></div>
            <div id="uploadResultLight"></div>
        </div>
        
        <div class="card" style="max-width: 500px; margin: 0 auto; width: 100%; border-top: 4px solid var(--heavy);">
            <div class="card-header"><h3 class="card-title">📦 Tải File Lớn (Không giới hạn)</h3></div>
            <div style="font-size: 0.85em; color: var(--text-light); margin-bottom: 12px; font-style: italic;">Hỗ trợ chọn nhiều file. Phân mảnh chống lỗi.</div>
            <input type="file" id="fileInputHeavy" multiple style="margin-bottom:12px; width: 100%; border: 1px dashed var(--border); padding: 15px; border-radius: 6px; box-sizing: border-box;">
            <button class="btn btn-primary" onclick="uploadHeavyFile()" id="btnUploadHeavy" style="width: 100%; padding: 10px; background:var(--heavy);">🚀 Tải lên</button>
            <div id="progressContainerHeavy" style="display:none; margin-top:15px;"><div style="display:flex; justify-content:space-between; font-size:0.85em; margin-bottom:5px; color:var(--text-light); font-weight:bold;"><span id="progressStatusHeavy">Đang xử lý...</span> <span id="progressTextHeavy">0%</span></div><div style="width:100%; background:#e2e8f0; border-radius:8px; height:8px;"><div id="progressBarHeavy" style="width:0%; height:100%; background:var(--heavy); transition:width 0.1s;"></div></div></div>
            <div id="uploadResultHeavy"></div>
        </div>
    </div>
</div>

<div class="modal" id="loginModal"><div class="modal-content" style="max-width: 320px;"><h3>Mật khẩu Quản trị</h3><input type="password" id="adminPass" placeholder="..."><button class="btn btn-primary" onclick="login()" style="width:100%; padding: 8px;">Đăng nhập</button><button class="btn" onclick="closeModal('loginModal')" style="width:100%; padding: 8px; background:#e2e8f0; color:#475569">Hủy</button></div></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwYeoqfFXK5GyIJgzA_3J3LPkxkyGYFI59mOz9xpcga59TvGKil-gjYcPZL59yZOuhQ/exec"; 
    let adminPassword = sessionStorage.getItem('adminPassword') || "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; } function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    async function login() { const inputPass = document.getElementById('adminPass').value; const btnLogin = document.querySelector('#loginModal .btn-primary'); const originalText = btnLogin.innerText; btnLogin.innerText = "Đang kiểm tra..."; btnLogin.disabled = true; try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ adminPassword: inputPass, action: 'verify' }) }); const result = await res.json(); if (result.status === 'success') { adminPassword = inputPass; sessionStorage.setItem('adminPassword', adminPassword); document.body.classList.add('logged-in'); closeModal('loginModal'); document.getElementById('adminPass').value = ''; } else { alert("Sai mật khẩu!"); document.getElementById('adminPass').value = ''; } } catch(e) { alert("Lỗi mạng!"); } finally { btnLogin.innerText = originalText; btnLogin.disabled = false; } }
    function logout() { adminPassword = ""; sessionStorage.removeItem('adminPassword'); document.body.classList.remove('logged-in'); }
    
    async function uploadLightFile() {
        const fileInput = document.getElementById('fileInputLight'); const files = fileInput.files;
        if (files.length === 0) return alert("Vui lòng chọn ít nhất 1 file!");
        const btn = document.getElementById('btnUploadLight'); const resultDiv = document.getElementById('uploadResultLight');
        const pContainer = document.getElementById('progressContainerLight'); const pBar = document.getElementById('progressBarLight');
        const pText = document.getElementById('progressTextLight'); const pStatus = document.getElementById('progressStatusLight');
        
        btn.disabled = true; pContainer.style.display = 'block'; 
        let listHTML = `<div class="file-list-container">`;
        for(let i = 0; i < files.length; i++) { listHTML += `<div class="file-item"><span class="file-name" title="${files[i].name}">${files[i].name}</span><span class="file-status" id="status-light-${i}" style="color: #94a3b8;">⏳ Đang chờ</span></div>`; }
        listHTML += `</div>`; resultDiv.innerHTML = listHTML;
        
        for(let i = 0; i < files.length; i++) {
            const file = files[i]; const statusEl = document.getElementById(`status-light-${i}`);
            if (file.size > 15 * 1024 * 1024) { statusEl.style.color = '#ef4444'; statusEl.innerText = '❌ Quá lớn (>15MB)'; continue; }
            
            btn.innerText = `Đang tải ${i+1}/${files.length}...`; pBar.style.width = '0%'; pText.innerText = '0%'; pStatus.innerText = `Đang xử lý: ${file.name}`; statusEl.style.color = '#0ea5e9'; statusEl.innerText = 'Đang tải 0%';
            let fakeProgress = 0;
            const progressInterval = setInterval(() => { if (fakeProgress < 90) { fakeProgress += Math.floor(Math.random() * 8) + 1; if(fakeProgress > 90) fakeProgress = 90; pBar.style.width = fakeProgress + '%'; pText.innerText = fakeProgress + '%'; statusEl.innerText = `Đang tải ${fakeProgress}%`; } }, 300);
            
            try {
                const base64Data = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = e => resolve(e.target.result.split(',')[1]); reader.onerror = e => reject(e); reader.readAsDataURL(file); });
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'upload', data: { fileName: file.name, mimeType: file.type, base64: base64Data } }) });
                clearInterval(progressInterval); const result = await res.json();
                if (result.status === 'success') { pBar.style.width = '100%'; pText.innerText = '100%'; statusEl.style.color = '#10b981'; statusEl.innerHTML = `✅ Xong | <a href="${result.fileUrl}" target="_blank" style="color:#10b981; text-decoration: underline;">Mở</a>`; } 
                else { statusEl.style.color = '#ef4444'; statusEl.innerText = `❌ Lỗi`; }
            } catch(error) { clearInterval(progressInterval); statusEl.style.color = '#ef4444'; statusEl.innerText = `❌ Lỗi mạng`; }
        } 
        pStatus.innerText = "Tất cả file đã xử lý xong!"; btn.innerText = "🚀 Tải lên (Chế độ Nhanh)"; btn.disabled = false; setTimeout(() => pContainer.style.display = 'none', 3000); fileInput.value = '';
    }

    async function uploadHeavyFile() {
        const fileInput = document.getElementById('fileInputHeavy'); const files = fileInput.files;
        if (files.length === 0) return alert("Vui lòng chọn ít nhất 1 file!");
        const btn = document.getElementById('btnUploadHeavy'); const resultDiv = document.getElementById('uploadResultHeavy');
        const pContainer = document.getElementById('progressContainerHeavy'); const pBar = document.getElementById('progressBarHeavy');
        const pText = document.getElementById('progressTextHeavy'); const pStatus = document.getElementById('progressStatusHeavy');
        
        btn.disabled = true; pContainer.style.display = 'block'; 
        let listHTML = `<div class="file-list-container">`;
        for(let i = 0; i < files.length; i++) { listHTML += `<div class="file-item"><span class="file-name" title="${files[i].name}">${files[i].name}</span><span class="file-status" id="status-heavy-${i}" style="color: #94a3b8;">⏳ Đang chờ</span></div>`; }
        listHTML += `</div>`; resultDiv.innerHTML = listHTML;
        
        for(let i = 0; i < files.length; i++) {
            const file = files[i]; const statusEl = document.getElementById(`status-heavy-${i}`);
            btn.innerText = `Đang xử lý ${i+1}/${files.length}...`; pBar.style.width = '0%'; pText.innerText = '0%'; pStatus.innerText = `Xin quyền tải: ${file.name}`; statusEl.style.color = 'var(--heavy)'; statusEl.innerText = 'Khởi tạo...';
            try {
                const resUrl = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getResumableUrl', data: { fileName: file.name, mimeType: file.type || 'application/octet-stream', fileSize: file.size, origin: window.location.origin } }) });
                const urlData = await resUrl.json();
                if(urlData.status !== 'success') throw new Error("Lỗi luồng!");
                const resumableUrl = urlData.resumableUrl; pStatus.innerText = `Đang truyền: ${file.name}`;
                
                await new Promise((resolve) => {
                    const xhr = new XMLHttpRequest(); xhr.open('PUT', resumableUrl, true);
                    xhr.upload.onprogress = function(e) { if(e.lengthComputable) { const pct = Math.round((e.loaded / e.total) * 100); pBar.style.width = pct + '%'; pText.innerText = pct + '%'; btn.innerText = `Tải file ${i+1}/${files.length}: ${pct}%`; statusEl.innerText = `Đang tải ${pct}%`; } };
                    xhr.onload = async function() {
                        if(xhr.status === 200 || xhr.status === 201 || xhr.status === 308) {
                            pStatus.innerText = `Cấu hình quyền cho: ${file.name}`; statusEl.innerText = `Đang duyệt quyền...`;
                            let fileId = "";
                            try { const fileInfo = JSON.parse(xhr.responseText); fileId = fileInfo.id; } 
                            catch(e) { statusEl.style.color = '#ef4444'; statusEl.innerText = `⚠️ Lỗi file ID`; return resolve(); }
                            try {
                                const resPerm = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'setPermission', data: { fileId: fileId } }) });
                                const permData = await resPerm.json();
                                if(permData.status === 'success') { statusEl.style.color = '#10b981'; statusEl.innerHTML = `✅ Xong | <a href="${permData.fileUrl}" target="_blank" style="color:#10b981; text-decoration: underline;">Mở</a>`; } 
                                else { statusEl.style.color = '#ef4444'; statusEl.innerText = `⚠️ Lỗi phân quyền`; }
                            } catch(err) { statusEl.style.color = '#ef4444'; statusEl.innerText = `⚠️ Lỗi mạng lúc mở quyền`; }
                        } else { statusEl.style.color = '#ef4444'; statusEl.innerText = `❌ Lỗi máy chủ`; }
                        resolve(); 
                    };
                    xhr.onerror = function() { statusEl.style.color = '#ef4444'; statusEl.innerText = `❌ Rớt mạng`; resolve(); };
                    xhr.send(file);
                }); 
            } catch(error) { statusEl.style.color = '#ef4444'; statusEl.innerText = `❌ Lỗi khởi tạo`; }
        } 
        pStatus.innerText = "Tất cả file đã tải xong!"; btn.innerText = "🚀 Tải lên (Chế độ Phân mảnh)"; btn.disabled = false; setTimeout(() => pContainer.style.display = 'none', 3000); fileInput.value = '';
    }
    window.onload = () => { if(adminPassword) document.body.classList.add('logged-in'); };
</script>
</body>
</html>
