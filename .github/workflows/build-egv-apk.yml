name: Build E-GV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "egv-android-v1.1-native-app-bridge/**"
      - ".github/workflows/build-egv-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: egv-android-v1.1-native-app-bridge

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Biên dịch APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Ký APK thử nghiệm
        run: |
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS_DIR/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk E-GV-v1.1-native-bridge-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks android.keystore \
            --ks-key-alias egvtrial \
            --ks-pass pass:EGV-Trial-2026! \
            --key-pass pass:EGV-Trial-2026! \
            --out E-GV-v1.1-native-bridge.apk \
            E-GV-v1.1-native-bridge-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose E-GV-v1.1-native-bridge.apk

      - name: Đưa APK lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: E-GV-v1.1-native-bridge
          path: egv-android-v1.1-native-app-bridge/E-GV-v1.1-native-bridge.apk
          if-no-files-found: error
