<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Nhật ký theo dõi sửa chữa, bảo hành và chi phí cơ sở vật chất.">
    <meta name="theme-color" content="#0284c7">
    <title>Nhật ký sửa chữa - Sổ tay tiện ích</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/repairs.js" defer></script>
</head>
<body>
    <div id="appShell"></div>
    <main class="page-main">
        <div class="container">
            <header class="page-heading">
                <div><p class="page-eyebrow">Cơ sở vật chất</p><h1 class="page-title">Nhật ký sửa chữa</h1><p class="page-description">Theo dõi sự cố, đơn vị xử lý, chi phí và thời hạn bảo hành của thiết bị trong trường.</p></div>
                <div class="page-actions"><button class="btn btn-repair admin-only" id="addRepairButton" type="button">＋ Thêm báo cáo</button></div>
            </header>

            <section class="overview-grid repair-summary" aria-label="Thống kê sửa chữa">
                <article class="stat-card"><span class="stat-label">Tổng hạng mục</span><strong class="stat-value" id="repairTotal">—</strong><div class="stat-hint">Tất cả báo cáo</div></article>
                <article class="stat-card"><span class="stat-label">Đang chờ</span><strong class="stat-value" id="repairPending">—</strong><div class="stat-hint">Chưa hoàn thành</div></article>
                <article class="stat-card"><span class="stat-label">Cần theo dõi</span><strong class="stat-value" id="repairWatch">—</strong><div class="stat-hint">Cần kiểm tra lại</div></article>
                <article class="stat-card"><span class="stat-label">Tổng chi phí</span><strong class="stat-value" id="repairCost">—</strong><div class="stat-hint">Theo dữ liệu đang lưu</div></article>
            </section>

            <section class="panel toolbar" aria-label="Tìm kiếm và lọc sửa chữa">
                <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><label class="sr-only" for="repairSearch">Tìm kiếm</label><input class="search-input" id="repairSearch" type="search" placeholder="Tìm công việc, lớp hoặc đơn vị sửa chữa…"></div>
                <label class="sr-only" for="repairStatus">Lọc trạng thái</label>
                <select class="select-input" id="repairStatus"><option value="all">Tất cả trạng thái</option><option value="Đã hoàn thành">Đã hoàn thành</option><option value="Đang chờ linh kiện">Đang chờ linh kiện</option><option value="Cần theo dõi">Cần theo dõi</option></select>
            </section>

            <section class="grid" id="repairContainer" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></section>
        </div>
    </main>

    <div class="modal" id="repairModal" role="dialog" aria-modal="true" aria-labelledby="repairModalTitle">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title" id="repairModalTitle">Thêm báo cáo sửa chữa</h2><button class="modal-close" type="button" data-close-modal="repairModal" aria-label="Đóng">×</button></div>
            <form id="repairForm">
                <div class="form-grid">
                    <div class="form-group full-width"><label class="form-label" for="rTask">Công việc/sự cố</label><input class="form-control" id="rTask" required maxlength="180"></div>
                    <div class="form-group"><label class="form-label" for="rDate">Ngày ghi nhận</label><input class="form-control" type="date" id="rDate" required></div>
                    <div class="form-group"><label class="form-label" for="rLocation">Lớp/phòng</label><input class="form-control" id="rLocation" placeholder="Ví dụ: Lớp 4/6"></div>
                    <div class="form-group"><label class="form-label" for="rCost">Chi phí (đồng)</label><input class="form-control" type="number" min="0" step="1000" id="rCost"></div>
                    <div class="form-group"><label class="form-label" for="rStatus">Trạng thái</label><select class="form-control" id="rStatus"><option value="Đang chờ linh kiện">Đang chờ linh kiện</option><option value="Cần theo dõi">Cần theo dõi</option><option value="Đã hoàn thành">Đã hoàn thành</option></select></div>
                    <div class="form-group"><label class="form-label" for="rWarranty">Bảo hành</label><select class="form-control" id="rWarranty"><option value="Không">Không có</option><option value="1 tháng">1 tháng</option><option value="3 tháng">3 tháng</option><option value="6 tháng">6 tháng</option><option value="12 tháng">12 tháng</option><option value="24 tháng">24 tháng</option></select></div>
                    <div class="form-group"><label class="form-label" for="rVendor">Đơn vị sửa/mua</label><input class="form-control" id="rVendor"></div>
                    <div class="form-group"><label class="form-label" for="rReporter">Người báo</label><input class="form-control" id="rReporter"></div>
                    <div class="form-group"><label class="form-label" for="rImageUrl">Liên kết ảnh</label><input class="form-control" type="url" id="rImageUrl" placeholder="https://…"></div>
                    <div class="form-group full-width"><label class="form-label" for="rNote">Ghi chú</label><textarea class="form-control" id="rNote" rows="3"></textarea></div>
                </div>
                <div class="form-actions"><button class="btn btn-secondary" type="button" data-close-modal="repairModal">Hủy</button><button class="btn btn-repair" id="saveRepairButton" type="submit">Lưu báo cáo</button></div>
            </form>
        </div>
    </div>
</body>
</html>
