<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Quản lý nhóm học – E-GV</title>
  <link rel="stylesheet" href="style.css?v=9.8.0">
  <link rel="stylesheet" href="modern-saas.css?v=9.3.0">
  <link rel="stylesheet" href="groups.css?v=9.5.3">
  <script src="js/config.js?v=9.7.0" defer></script>
  <script src="js/app.js?v=9.8.0" defer></script>
  <script src="js/groups.js?v=9.8.0" defer></script>
</head>
<body class="page-groups">
  <div id="appShell"></div>
  <main class="page-main"><div class="container">
    <header class="page-heading">
      <div><p class="page-eyebrow">Sổ theo dõi giảng dạy</p><h1 class="page-title">Quản lý nhóm học</h1><p class="page-description">Điểm danh nhanh, theo dõi từng buổi và học phí theo kỳ 8 buổi.</p></div>
      <button class="btn btn-primary" id="nhAddGroup" type="button" hidden>+ Tạo nhóm</button>
    </header>
    <section class="panel nh-gate" id="nhGate"><h2>Đăng nhập quản trị để quản lý nhóm học</h2><p>Thông tin học sinh, điểm danh và học phí chỉ dành cho quản trị.</p><button class="btn btn-primary" type="button" id="nhLogin">Đăng nhập quản trị</button></section>
    <p class="nh-feedback" id="nhFeedback" role="status" aria-live="polite" hidden></p>
    <div id="nhWorkspace" hidden>
      <nav id="nhGroupCards" class="nh-group-cards" aria-label="Chọn nhóm học"></nav>
      <section class="panel nh-toolbar" aria-label="Chọn nhóm và kỳ học">
        <label class="nh-group-select">Nhóm học<select id="nhGroup" class="form-control"></select></label>
        <label>Kỳ học<div class="nh-month-picker"><button type="button" id="nhPrevMonth" aria-label="Xem kỳ trước">‹</button><input id="nhMonth" class="form-control" type="month" min="2000-01" max="2100-12"><button type="button" id="nhNextMonth" aria-label="Xem kỳ sau">›</button></div></label>
        <button class="btn btn-secondary" type="button" id="nhReload">Tải lại</button>
        <button class="btn btn-secondary" type="button" id="nhEditGroup" hidden>Cài đặt nhóm</button>
      </section>
      <section class="panel nh-empty" id="nhEmpty" hidden><h2>Chưa có nhóm học</h2><p id="nhEmptyText"></p></section>
      <div id="nhGroupContent" hidden>
        <div class="nh-group-meta"><p id="nhGroupHint"></p><button type="button" class="btn btn-secondary" id="nhExport">Xuất CSV (Excel)</button></div>
        <section id="nhPeriodInfo" class="nh-period-info" aria-label="Tiến độ kỳ học" hidden></section>
        <section class="nh-stats" aria-label="Tổng hợp kỳ học" id="nhStats"></section>
        <nav class="nh-tabs" aria-label="Chức năng nhóm học">
          <button type="button" data-tab="attendance" aria-pressed="true">Điểm danh</button>
          <button type="button" data-tab="students" aria-pressed="false">Học sinh</button>
          <button type="button" data-tab="fees" aria-pressed="false">Học phí</button>
          <button type="button" id="nhFilesTab" data-tab="files" aria-pressed="false" hidden>Tệp</button>
        </nav>
        <section id="nhAttendancePanel" class="nh-tab-panel nh-attendance-panel">
          <div class="nh-attendance-modes" aria-label="Cách xem điểm danh">
            <button type="button" id="nhAllSessionsMode" data-attendance-mode="overview" aria-pressed="true">Tất cả 8 buổi</button>
            <button type="button" data-attendance-mode="day" aria-pressed="false">Theo buổi</button>
          </div>
          <div id="nhAttendanceToolbar" class="nh-attendance-toolbar"></div>
          <section id="nhOverview" aria-label="Tất cả học sinh và buổi học"></section>
          <section id="nhAttendance" aria-label="Điểm danh một buổi" hidden></section>
          <div class="nh-save-bar"><p id="nhSaveHint"></p><button class="btn btn-primary" type="button" data-action="save-attendance" id="nhSaveAttendance">Lưu điểm danh</button></div>
        </section>
        <section id="nhStudents" class="nh-tab-panel" hidden></section>
        <section id="nhFees" class="nh-tab-panel" hidden></section>
        <section id="nhFiles" class="nh-tab-panel" hidden></section>
      </div>
    </div>
  </div></main>
  <dialog class="nh-dialog" id="nhDialog" aria-labelledby="nhDialogTitle"><form id="nhForm"><header><h2 id="nhDialogTitle"></h2><button class="nh-close" type="button" id="nhCloseDialog" aria-label="Đóng">×</button></header><div id="nhFormFields"></div><p id="nhFormError" class="nh-error" role="alert" hidden></p><footer><button type="button" class="btn btn-secondary" id="nhCancelDialog">Hủy</button><button type="submit" class="btn btn-primary" id="nhSubmit">Lưu</button></footer></form></dialog>
  <dialog class="nh-profile" id="nhProfile" aria-labelledby="nhProfileName"><header><div><p class="page-eyebrow" id="nhProfilePeriod"></p><h2 id="nhProfileName"></h2></div><button class="nh-close" id="nhCloseProfile" type="button" aria-label="Đóng hồ sơ học sinh">×</button></header><div id="nhProfileBody"></div></dialog>
  <div id="nhBusy" class="nh-busy" hidden role="status"><span></span><p id="nhBusyText">Đang tải dữ liệu…</p></div>
</body>
</html>
