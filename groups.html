<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Quản lý nhóm học – E-GV</title>
  <link rel="stylesheet" href="style.css?v=9.3.0">
  <link rel="stylesheet" href="modern-saas.css?v=9.3.0">
  <link rel="stylesheet" href="groups.css?v=9.3.0">
  <script src="js/config.js" defer></script>
  <script src="js/app.js?v=9.3.0" defer></script>
  <script src="js/groups.js?v=9.3.0" defer></script>
</head>
<body class="page-groups">
  <div id="appShell"></div>
  <main class="page-main"><div class="container">
    <header class="page-heading">
      <div><p class="page-eyebrow">Sổ theo dõi giảng dạy</p><h1 class="page-title">Quản lý nhóm học</h1><p class="page-description">Danh sách học sinh, điểm danh và học phí trong cùng một nơi.</p></div>
      <button class="btn btn-primary" id="nhAddGroup" type="button" hidden>+ Tạo nhóm</button>
    </header>
    <section class="panel nh-gate" id="nhGate"><h2>Đăng nhập để quản lý nhóm học</h2><p>Giáo viên xem các nhóm được giao. Quản trị quản lý toàn bộ nhóm.</p><button class="btn btn-primary" type="button" id="nhLogin">Đăng nhập</button></section>
    <p class="nh-feedback" id="nhFeedback" role="status" aria-live="polite" hidden></p>
    <div id="nhWorkspace" hidden>
      <section class="panel nh-toolbar" aria-label="Chọn nhóm và tháng">
        <label>Nhóm học<select id="nhGroup" class="form-control"></select></label>
        <label>Tháng theo dõi<input id="nhMonth" class="form-control" type="month" min="2000-01" max="2100-12"></label>
        <button class="btn btn-secondary" type="button" id="nhReload">Tải lại</button>
        <button class="btn btn-secondary" type="button" id="nhEditGroup" hidden>Cài đặt nhóm</button>
      </section>
      <section class="panel nh-empty" id="nhEmpty" hidden><h2>Chưa có nhóm học</h2><p id="nhEmptyText"></p></section>
      <div id="nhGroupContent" hidden>
        <div class="nh-group-meta"><p id="nhGroupHint"></p><button type="button" class="btn btn-secondary" id="nhExport">Xuất CSV (Excel)</button></div>
        <section class="nh-stats" aria-label="Tổng hợp tháng" id="nhStats"></section>
        <nav class="nh-tabs" aria-label="Chức năng nhóm học">
          <button type="button" data-tab="attendance" aria-pressed="true">Điểm danh</button>
          <button type="button" data-tab="students" aria-pressed="false">Học sinh</button>
          <button type="button" data-tab="fees" aria-pressed="false">Học phí</button>
        </nav>
        <section id="nhAttendance" class="nh-tab-panel"></section>
        <section id="nhStudents" class="nh-tab-panel" hidden></section>
        <section id="nhFees" class="nh-tab-panel" hidden></section>
      </div>
    </div>
  </div></main>
  <dialog class="nh-dialog" id="nhDialog" aria-labelledby="nhDialogTitle"><form id="nhForm"><header><h2 id="nhDialogTitle"></h2><button class="nh-close" type="button" id="nhCloseDialog" aria-label="Đóng">×</button></header><div id="nhFormFields"></div><p id="nhFormError" class="nh-error" role="alert" hidden></p><footer><button type="button" class="btn btn-secondary" id="nhCancelDialog">Hủy</button><button type="submit" class="btn btn-primary" id="nhSubmit">Lưu</button></footer></form></dialog>
  <div id="nhBusy" class="nh-busy" hidden role="status"><span></span><p id="nhBusyText">Đang tải dữ liệu…</p></div>
</body>
</html>
