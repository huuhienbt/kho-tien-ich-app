<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ Giảng AI - Tiện Ích</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="main-nav">
        <div class="nav-tabs">
            <a href="index.html" class="nav-btn">🏠 Trang Chủ</a>
            <a href="prompts.html" class="nav-btn">📚 Kho Prompt</a>
            <a href="repairs.html" class="nav-btn">🛠 Sổ Repairs</a>
            <a href="upload.html" class="nav-btn">📁 Upload Drive</a>
            <a href="ai.html" class="nav-btn active-ai">🤖 Trợ Giảng AI</a>
        </div>
        <div class="nav-actions">
            <button class="btn btn-primary btn-login" onclick="openModal('loginModal')">🔒 Đăng nhập</button>
            <button class="btn btn-danger admin-only btn-inline" onclick="logout()">Thoát quản trị</button>
        </div>
    </div>

    <div class="header">
        <h3>Trợ Giảng AI - Thiết Kế Giáo Án</h3>
        <span style="font-size:0.85em; color:var(--text-light)">Sử dụng sức mạnh của Google Gemini</span>
    </div>
    
    <div class="ai-form-container" style="max-width: 700px; margin: 0 auto;">
        <input type="text" id="aiSubject" class="ai-input full-width" placeholder="Môn học (Nếu để trống AI sẽ tự tìm trong ảnh)">
        <input type="text" id="aiLesson" class="ai-input" placeholder="Tên bài dạy (Nếu để trống AI sẽ tự tìm trong ảnh)">
        
        <div class="integration-section">
            <label style="font-weight: 600; color: #1e293b; display: block; margin-bottom: 5px;">📌 Chọn nội dung tích hợp (nếu có):</label>
            <div class="checkbox-grid">
                <label><input type="checkbox" value="An toàn giao thông (ATGT)"> An toàn giao thông</label>
                <label><input type="checkbox" value="Bảo vệ môi trường, biến đổi khí hậu"> Bảo vệ môi trường</label>
                <label><input type="checkbox" value="Quyền và nghĩa vụ của trẻ em"> Quyền trẻ em</label>
                <label><input type="checkbox" value="Phòng cháy, chữa cháy và cứu nạn (PCCC)"> PCCC & Cứu nạn</label>
                <label><input type="checkbox" value="Kỹ năng sống (KNS)"> Kỹ năng sống (KNS)</label>
                <label><input type="checkbox" value="Giáo dục lý tưởng cách mạng, đạo đức"> Đạo đức, lý tưởng</label>
                <label><input type="checkbox" value="Chủ quyền quốc gia, biển đảo"> Chủ quyền biển đảo</label>
                <label><input type="checkbox" value="Năng lực số và ứng dụng AI"> Năng lực số & AI</label>
                <label><input type="checkbox" value="Giáo dục STEM"> Giáo dục STEM</label>
            </div>
            <input type="text" id="aiIntegratedOther" class="ai-input" style="margin-top: 10px; margin-bottom: 0;" placeholder="Hoặc nhập nội dung tích hợp khác...">
        </div>
        
        <div id="aiImageContainer">
            <p style="margin:0 0 10px 0; font-weight:bold; color:var(--text-light); font-size:0.95em;">📸 Tải lên ảnh SGK hoặc bài tập (Nhiều trang)</p>
            <p style="margin:0 0 10px 0; color:#64748b; font-size:0.85em;">(Chọn File hoặc bấm <kbd style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-weight:bold;">Ctrl + V</kbd> liên tục để dán nhiều ảnh)</p>
            <input type="file" id="aiImage" accept="image/*" multiple style="width:100%;">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div id="aiImagePreview" style="font-size: 0.85em; color: var(--ai); font-weight: bold;">Chưa có ảnh nào.</div>
                <button id="btnClearImages" onclick="clearAiImages()" style="display:none; padding: 2px 8px; border:none; background:#ef4444; color:white; border-radius:4px; font-size:0.8em; cursor:pointer;">Xóa ảnh</button>
            </div>
            <div id="aiImageTags" class="preview-list"></div>
        </div>

        <button class="btn btn-ai" id="btnGenerateAI" onclick="generateLessonPlan()" style="width: 100%; padding: 12px; font-size: 1.05em;">✨ AI Bắt Đầu Soạn Giáo Án</button>
    </div>

    <div id="aiResultBox" class="ai-result-box" style="max-width: 800px; margin: 20px auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
            <h3 style="margin:0; color:var(--ai);">📝 Kế Hoạch Bài Dạy</h3>
            <div style="display:flex; gap: 6px;">
                <button class="btn btn-sm" onclick="copyAIResult()" style="background:#e2e8f0; color:#334155;">📋 Copy</button>
                <button class="btn btn-sm" onclick="exportToWord()" style="background:#2563eb; color:white;">📄 Xuất Word (Chuẩn H/sơ)</button>
            </div>
        </div>
        <div id="aiContent" class="markdown-body"></div>
    </div>
</div>

<div class="modal" id="loginModal"><div class="modal-content" style="max-width: 320px;"><h3>Mật khẩu Quản trị</h3><input type="password" id="adminPass" placeholder="..."><button class="btn btn-primary" onclick="login()" style="width:100%; padding: 8px;">Đăng nhập</button><button class="btn" onclick="closeModal('loginModal')" style="width:100%; padding: 8px; background:#e2e8f0; color:#475569">Hủy</button></div></div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwYeoqfFXK5GyIJgzA_3J3LPkxkyGYFI59mOz9xpcga59TvGKil-gjYcPZL59yZOuhQ/exec"; 
    let adminPassword = sessionStorage.getItem('adminPassword') || "";

    function openModal(id) { document.getElementById(id).style.display = 'flex'; } function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    async function login() { const inputPass = document.getElementById('adminPass').value; const btnLogin = document.querySelector('#loginModal .btn-primary'); const originalText = btnLogin.innerText; btnLogin.innerText = "Đang kiểm tra..."; btnLogin.disabled = true; try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ adminPassword: inputPass, action: 'verify' }) }); const result = await res.json(); if (result.status === 'success') { adminPassword = inputPass; sessionStorage.setItem('adminPassword', adminPassword); document.body.classList.add('logged-in'); closeModal('loginModal'); document.getElementById('adminPass').value = ''; } else { alert("Sai mật khẩu!"); document.getElementById('adminPass').value = ''; } } catch(e) { alert("Lỗi mạng!"); } finally { btnLogin.innerText = originalText; btnLogin.disabled = false; } }
    function logout() { adminPassword = ""; sessionStorage.removeItem('adminPassword'); document.body.classList.remove('logged-in'); }

    const aiDataTransfer = new DataTransfer();
    function updateAiImagePreview() {
        const preview = document.getElementById('aiImagePreview'); const container = document.getElementById('aiImageContainer');
        const tagsBox = document.getElementById('aiImageTags'); const btnClear = document.getElementById('btnClearImages');
        const files = aiDataTransfer.files; tagsBox.innerHTML = '';
        if(files.length > 0) {
            preview.innerText = `✅ Đã nhận ${files.length} ảnh.`; container.style.borderColor = "var(--ai)"; container.style.backgroundColor = "#f5f3ff"; btnClear.style.display = 'block';
            for(let i=0; i<files.length; i++) { let fname = files[i].name; if(fname.length > 20) fname = fname.substring(0, 15) + '...'; tagsBox.innerHTML += `<div class="preview-item">🖼️ ${fname}</div>`; }
        } else { preview.innerText = "Chưa có ảnh nào."; container.style.borderColor = "#cbd5e1"; container.style.backgroundColor = "transparent"; btnClear.style.display = 'none'; }
        document.getElementById('aiImage').files = aiDataTransfer.files;
    }

    function clearAiImages() { aiDataTransfer.items.clear(); updateAiImagePreview(); }
    document.getElementById('aiImage').addEventListener('change', function() { for(let i = 0; i < this.files.length; i++) { aiDataTransfer.items.add(this.files[i]); } updateAiImagePreview(); });
    document.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items; let pastedCount = 0;
        for (let index in items) {
            const item = items[index];
            if (item.kind === 'file' && item.type.startsWith('image/')) {
                const blob = item.getAsFile(); const nowStr = new Date().toLocaleTimeString().replace(/:/g, '');
                aiDataTransfer.items.add(new File([blob], `Anh_Dan_${nowStr}_${pastedCount+1}.png`, { type: item.type })); pastedCount++;
            }
        }
        if (pastedCount > 0) updateAiImagePreview();
    });

    function parseMarkdownToHTML(text) {
        let html = text;
        html = html.replace(/\*\*KẾ HOẠCH BÀI DẠY\*\*/gi, '<p align="center" style="text-align: center; margin-bottom: 12pt;"><strong><span style="font-size: 15pt; text-transform: uppercase;">KẾ HOẠCH BÀI DẠY</span></strong></p>');
        html = html.replace(/^(I{1,3}|IV|V|VI)\.\s*(.*)$/gm, '<strong>$1. $2</strong>'); html = html.replace(/^([0-9]+)\.\s*(.*)$/gm, '<strong>$1. $2</strong>');
        html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>'); html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>'); html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/(?:\|.*\|\n)+/g, (match) => {
            let t = '<table>\n'; let lines = match.trim().split('\n');
            lines.forEach((line, index) => {
                if (line.match(/^\|(?:\s*[-:]+\s*\|)+$/)) return; 
                t += '<tr>'; let cells = line.split('|').slice(1, -1);
                cells.forEach((cell, cellIndex) => { 
                    let tag = index === 0 ? 'th' : 'td'; 
                    let widthStyle = cellIndex === 0 ? '60%' : '40%';
                    t += `<${tag} style="width: ${widthStyle};">${cell.trim().replace(/<br\s*\/?>/gi, '<br>')}</${tag}>`; 
                }); t += '</tr>\n';
            }); return t + '</table>';
        });
        html = html.replace(/\n(?!(?:.*?<\/td>|.*?<\/th>|.*?<\/tr>|.*?<\/table>|.*?<\/p>))/g, '<br>'); 
        html = html.replace(/<\/h1><br>/g, '</h1>').replace(/<\/h2><br>/g, '</h2>').replace(/<\/h3><br>/g, '</h3>').replace(/<\/table><br>/g, '</table>').replace(/<\/p><br>/g, '</p>'); 
        return html.replace(/<br><br><br>/g, '<br><br>');
    }

    async function generateLessonPlan() {
        const subject = document.getElementById('aiSubject').value; const lesson = document.getElementById('aiLesson').value; const files = aiDataTransfer.files;
        const checkedBoxes = document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked'); let integratedArr = Array.from(checkedBoxes).map(cb => cb.value);
        const otherIntegrated = document.getElementById('aiIntegratedOther').value.trim(); if(otherIntegrated) integratedArr.push(otherIntegrated);
        if (!subject && !lesson && files.length === 0) return alert("Vui lòng nhập thông tin hoặc cung cấp ít nhất 1 ảnh SGK!");

        const btn = document.getElementById('btnGenerateAI'); const resultBox = document.getElementById('aiResultBox'); const contentDiv = document.getElementById('aiContent');
        btn.innerText = "⏳ Đang nén ảnh..."; btn.disabled = true; resultBox.style.display = 'none'; contentDiv.innerHTML = '';

        try {
            let imagesDataArray = [];
            if (files.length > 0) {
                for(let i=0; i<files.length; i++) {
                    const file = files[i]; btn.innerText = `⏳ Đang nén ảnh ${i+1}/${files.length}...`;
                    const compressed = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = event => { const img = new Image(); img.onload = () => {
                            const canvas = document.createElement('canvas'); const MAX_WIDTH = 1000;
                            let width = img.width; let height = img.height; if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                            resolve({ base64: canvas.toDataURL('image/jpeg', 0.7).split(',')[1], mimeType: 'image/jpeg' });
                        }; img.onerror = () => reject("Lỗi ảnh"); img.src = event.target.result; }; reader.readAsDataURL(file);
                    }); imagesDataArray.push(compressed);
                }
            }
            btn.innerText = `🧠 AI Đang Phân Tích ${files.length} Ảnh (Chờ 5-15s)...`;
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'generate_lesson_plan', data: { subject, lesson, integrated: integratedArr.join(", "), images: imagesDataArray } }) });
            const result = await res.json();
            if (result.status === 'success') {
                let rawText = result.result;
                if(!rawText.includes("KẾ HOẠCH BÀI DẠY")) rawText = `**KẾ HOẠCH BÀI DẠY**\n\n**Môn:** ${subject || '...'}\n**Tên bài:** ${lesson || '...'}\n**Thời lượng:** 1 tiết (35 phút)\n\n` + rawText;
                contentDiv.innerHTML = parseMarkdownToHTML(rawText); contentDiv.setAttribute('data-raw', rawText); resultBox.style.display = 'block'; resultBox.scrollIntoView({ behavior: 'smooth' });
            } else { alert("Lỗi AI: " + result.message); }
        } catch (error) { alert("Lỗi mạng!"); } finally { btn.innerText = "✨ AI Bắt Đầu Soạn Giáo Án"; btn.disabled = false; }
    }

    function copyAIResult() { const rawText = document.getElementById('aiContent').getAttribute('data-raw'); if (rawText) navigator.clipboard.writeText(rawText).then(() => alert("Đã Copy giáo án!")); }

    function exportToWord() {
        const toNonAccent = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_");
        const fileName = `KHBD_${toNonAccent(document.getElementById('aiSubject').value || 'MON')}_${toNonAccent(document.getElementById('aiLesson').value || 'BAI')}.doc`;
        const sourceHTML = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>Kế Hoạch Bài Dạy</title>
            <style>
                @page Section1 { size: 595.3pt 841.9pt; margin: 42.5pt 42.5pt 42.5pt 56.7pt; mso-header-margin: 35.4pt; mso-footer-margin: 35.4pt; mso-paper-source: 0; }
                div.Section1 { page: Section1; }
                body, p, td, th, li, span { font-family: 'Times New Roman', serif; font-size: 14pt; line-height: 115%; mso-line-height-rule: exactly; }
                p { margin-top: 0pt; margin-bottom: 0pt; }
                h1, h2, h3 { font-weight: bold; margin-top: 12pt; margin-bottom: 6pt; font-family: 'Times New Roman', serif; } 
                h1 { font-size: 15pt; } h2 { font-size: 14pt; } h3 { font-size: 14pt; } 
                table { border-collapse: collapse; width: 100% !important; table-layout: fixed; mso-table-layout-alt: fixed; margin-top: 10pt; margin-bottom: 10pt; }
                table, th, td { border: 1pt solid windowtext; padding: 5pt; vertical-align: top; }
                th { text-align: center; font-weight: bold; background-color: #f2f2f2; } 
            </style>
        </head><body><div class="Section1">${document.getElementById('aiContent').innerHTML}</div></body></html>`;
        const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' }); const fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload); fileDownload.href = URL.createObjectURL(blob); fileDownload.download = fileName; fileDownload.click(); document.body.removeChild(fileDownload);
    }
    window.onload = () => { if(adminPassword) document.body.classList.add('logged-in'); };
</script>
</body>
</html>
